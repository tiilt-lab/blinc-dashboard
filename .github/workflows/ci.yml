name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      # Pinned to the deployment venv. requests (mailer), prometheus_client
      # (metrics) and moviepy (enrollment media) are imported at module level
      # by the tests of those modules, and utility.py (disk_free_fraction)
      # imports flask; without them collection or the import fails.
      # Flask-SQLAlchemy (the negotiation-coding app stub, 114 tests),
      # PyYAML (metrics), soundfile (post-hoc reader) and python-socketio
      # (multi-worker contract) are pure-Python installs whose absence made
      # whole files importorskip at collection: 187 of 990 tests never ran
      # in CI while the badge was green (2026-10-19). The torch-gated files
      # (enrollment_check, segment_split, silero VAD) stay local-only.
      - run: pip install pytest numpy scipy flask==3.1.3 Flask-SQLAlchemy==3.1.1 PyYAML==6.0.3 soundfile==0.14.0 python-socketio==5.16.3 requests==2.34.2 prometheus_client==0.25.0 moviepy==2.2.1
      # ffmpeg, as on the deployment host: eight tests (loadgen, video decode,
      # voice-only enrollment) skip without it.
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      # Unit + contract tests: pure analytics, enrollment verdict logic,
      # voice-overlap math, posthoc-queue persistence, negotiation coding,
      # and source-level producer/consumer contracts. No DB/GPU/network.
      - run: python -m pytest tests/ -q -rs | tee pytest.log
      # Skips are listed (-rs) and capped: the torch/silero gates account for
      # 5 today. A new module-level importorskip would push the count over
      # the cap instead of silently shrinking the suite again.
      - name: skipped-tests cap
        run: |
          CAP=8
          SKIPPED=$(grep -oE '[0-9]+ skipped' pytest.log | grep -oE '^[0-9]+' || echo 0)
          echo "skipped tests: $SKIPPED (cap: $CAP)"
          test "$SKIPPED" -le "$CAP"

  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      # Pinned so the violation count is deterministic across runners.
      - run: pip install ruff==0.16.2
      # Ratcheted gate, mirroring the eslint --max-warnings policy: the backend
      # had no static analysis, so a full backlog can't be required to be zero
      # today. The cap lets no NEW violation in and must only ever DECREASE.
      # Rules + excludes live in pyproject.toml (F/E9/E722 — real bugs, not
      # style). Lower CAP whenever the count drops.
      - name: ruff (ratcheted)
        run: |
          CAP=0
          COUNT=$(ruff check src --output-format json | python -c "import json,sys; print(len(json.load(sys.stdin)))")
          echo "ruff violations: $COUNT (cap: $CAP)"
          test "$COUNT" -le "$CAP"

  deptry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install deptry==0.25.1
      # Dependency hygiene: what src/ imports must be what
      # src/requirements-direct.txt lists (nothing unused, missing or only
      # transitive), and the lock must pin every direct dependency.
      - run: bash tools/ci/deptry_check.sh

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # Lint gates on errors (rules-of-hooks — conditional-hook crashes) and
      # ratchets warnings. The backlog across .js AND .jsx is 276 (of which 65
      # are react-hooks/exhaustive-deps — the bug class behind three
      # production incidents this month); the cap lets none NEW in and must
      # only ever decrease. NOTE: --ext .js,.jsx is required — without it
      # eslint 8 silently skips every .jsx component.
      - run: npx eslint src --ext .js,.jsx --max-warnings 252
      # Type-checks converted .ts files (strict); existing .js/.jsx are
      # allowed but unchecked (gradual adoption). Fails only on typed code,
      # so it can't be blocked by the legacy JS backlog.
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # The repo is public; block credentials before they land. Run the
      # gitleaks BINARY (MIT, free) rather than gitleaks-action, which
      # requires a paid license for organization repos. `git` mode scans the
      # full history; the config below silences known non-secrets.
      - name: gitleaks
        run: |
          VERSION=8.18.4
          SHA256=ba6dbb656933921c775ee5a2d1c13a91046e7952e9d919f9bac4cec61d628e7d
          # -f + retries: a transient GitHub error page used to reach tar as
          # "not in gzip format" and fail the job (run 42567469535). The
          # checksum is from the release's gitleaks_8.18.4_checksums.txt.
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 3 -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          echo "${SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          # Scope to the built ref's history only. fetch-depth:0 pulls ALL
          # branches, and gitleaks would otherwise scan stale ones (e.g. the
          # un-rewritten aziza_topics still holding the rotated GCP key) and
          # fail on history that isn't part of this branch.
          ./gitleaks detect --config .gitleaks.toml --redact --no-banner --log-opts="HEAD"

  migrations:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: blinc
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 24
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      # Only what the chain itself needs: env.py runs without the Flask app
      # and run_migrations.py builds the Alembic config from the URL below.
      # Pinned to the versions the deployment's venv uses.
      - run: pip install alembic==1.18.5 sqlalchemy==2.0.51 mysql-connector-python==9.7.0
      # Proves `upgrade head` rebuilds production's schema from an empty
      # database and that every downgrade still runs: head -> base -> head.
      # tests/test_migration_chain.py covers the chain's shape; this covers
      # the DDL against a real MySQL 8.
      - run: python src/server/migrations/run_migrations.py roundtrip
        env:
          DC_DATABASE_URL: mysql+mysqlconnector://root:root@127.0.0.1:3306/blinc

# E2E tests (tests/e2e/) exercise a live deployment with real credentials
# and are run manually — see the header of tests/e2e/join-record.spec.js.
# They stay out of CI: this repository is public, and no deployment secrets
# belong in it or its workflows. When wanted, run them from a self-hosted
# runner on the deployment host so secrets never leave the machine.
